# Infrastructure services for local development and the host dev flow.
#
# Two consumers, one project (name `datacode`):
#   * the HOST dev stack   — `make dev` starts postgres + redis when they are
#     not already reachable (scripts/dev-lib.sh::ensure_infra). Dev expects
#     them on localhost; the password is the truth file's (see postgres below).
#   * the container stacks — merged with the stack/dagster compose files so
#     every service resolves `postgres` / `redis` by name on one network.
#
# Usage: docker compose -f deploy/docker-compose.infra.yml up -d
# (create the password file first: scripts/pg-password.sh ensure — the make
#  targets do this automatically)

name: datacode

services:
  postgres:
    image: postgres:16-alpine
    container_name: datacode-postgres
    environment:
      POSTGRES_USER: datacode
      # The password comes from the TRUTH FILE mounted read-only below — the
      # same file every client reads (dev scripts export it as DB_PASSWORD,
      # the Makefile injects it into every compose invocation). An env-based
      # POSTGRES_PASSWORD would be a second source that only takes effect on
      # the volume's FIRST initialization, which is exactly how the declared
      # and the actual password used to drift apart. Change it only with:
      #   make pg-set-password PASSWORD=...
      # The file must exist BEFORE `docker compose up` (Docker would turn a
      # missing host file into a directory and break the entrypoint): every
      # make target and scripts/dev-start.sh create it; for a bare compose
      # run, `scripts/pg-password.sh ensure` first.
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: datacode
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../.data/postgres_password:/run/secrets/postgres_password:ro
      - ./init-db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datacode"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis backs the coordination primitives that must be shared across
  # replicas: login rate limiting, SQLMesh environment locks and the SSE event
  # bus. It is a first-class dependency of the control plane, not an optional
  # add-on, so it always starts with the infrastructure.
  #
  # AOF is enabled because the state kept here (lockout counters, environment
  # locks) must survive a restart: losing it silently widens a brute-force
  # window and drops in-flight write protection.
  redis:
    image: redis:7-alpine
    container_name: datacode-redis
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Optional self-hosted Git service for the workspace git integration.
  # It listens on HOST port 3002, not 3000/3001: both are taken by a Dagster
  # webserver — 3000 by the containerized one (docker-compose.dagster.yml) and
  # 3001 by the one the host dev runtime spawns (conf/workspace-runtime.yaml,
  # dagster.webserver_port). Gitea on either makes the asset DAG unreachable
  # ("port is already allocated", or a webserver that cannot bind). The
  # container port stays 3000, so only ROOT_URL had to follow.
  #
  # Still behind the "gitea" profile: it is an optional add-on for the git
  # integration, not a dependency of the platform, so neither the Dagster
  # stacks nor the core dev flow activates it. `make infra` / the dev scripts
  # opt in explicitly via --profile gitea.
  gitea:
    image: gitea/gitea:1.21-rootless
    profiles: ["gitea"]
    container_name: datacode-gitea
    environment:
      # Gitea shares the postgres service's database user, so its password
      # arrives as DB_PASSWORD from the same truth file the postgres service
      # mounts (injected by `make infra`; export DB_PASSWORD yourself for a
      # bare compose run). Unlike POSTGRES_PASSWORD_FILE — which only matters
      # on first volume init — Gitea re-reads this on every start, so a
      # `make pg-set-password` + restart keeps it aligned automatically.
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=postgres:5432
      - GITEA__database__NAME=gitea
      - GITEA__database__USER=datacode
      - GITEA__database__PASSWD=${DB_PASSWORD}
      - GITEA__server__ROOT_URL=http://localhost:3002
      - GITEA__server__HTTP_PORT=3000
    ports:
      # host 3002 -> container 3000 (3000 and 3001 are Dagster webservers')
      - "3002:3000"
    volumes:
      - gitea_data:/var/lib/gitea
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  gitea_data:
