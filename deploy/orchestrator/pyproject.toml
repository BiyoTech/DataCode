[project]
name = "datacode-dagster-control-plane"
version = "0.1.0"
description = "Control-plane support for DataCode's Dagster deployment (code location registration channel)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
    # Local shared package, NOT published to any index (PyPI has no
    # datacode-common). Install it beforehand or in the same pip command,
    # e.g. `pip install ./shared/python ./dagster-control-plane`; the dev
    # scripts already install shared first. pip then sees the requirement
    # satisfied and never hits the network.
    "datacode-common",
]

[tool.hatch.metadata]
allow-direct-references = true

[project.scripts]
datacode-workspace-sync = "datacode_dagster_control_plane.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datacode_dagster_control_plane"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
