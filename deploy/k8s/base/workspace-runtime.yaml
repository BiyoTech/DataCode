# workspace-runtime — Kubernetes deployment (design 06 P4a/P4b).
#
# A StatefulSet, NOT a Deployment, and this is load-bearing:
#   * the lease's runtime identity (DATACODE_RUNTIME_ID from metadata.name)
#     must be stable across restarts, or every pod replacement strands its
#     leases in Redis for a full TTL;
#   * volumeClaimTemplates give each replica its OWN ReadWriteOnce volume —
#     the "persisted local disk" of design 07 ADR-003. A single RWX PVC here
#     would be a shared NFS under another name and is rejected by the runtime
#     itself (materialize.mount_kind: shared + leases = startup failure).
#
# Storage medium: instance_local (per-replica RWO PVC). Working copies and
# .repo survive rolling updates and OOMKills, so those events stop consuming
# the Q6 durability window (10-minute WIP snapshots).
#
# Scale-out is horizontal (more replicas) and coordinated by the lease
# subsystem: the gateway resolves each working copy to its owning pod via
# Redis and dials the pod directly through the headless service.
#
# Configuration: the conf/ ConfigMap (generated by kustomization.yaml from the
# repository's conf/ directory) mounted at /app/conf, with DATACODE_ENV
# selecting the profile. The previously-declared WORKSPACE_RUNTIME_DB_* and
# REDIS_HOST variables were removed deliberately — the runtime reads neither
# (Redis/DB come from the platform config; DB_PASSWORD is the only db-related
# env it consumes), so they described a config that never took effect.
---
apiVersion: v1
kind: Service
metadata:
  name: workspace-runtime
  namespace: datacode
  labels:
    app: workspace-runtime
  annotations:
    # Headless on purpose: the ClusterIP of a normal Service load balances,
    # which is exactly what a lease forbids. Consumers dial POD addresses
    # resolved via the lease; the service only provides DNS for them.
    service.alpha.kubernetes.io/tolerate-unready-endpoints: "true"
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: workspace-runtime
  ports:
    - name: rest
      port: 8002
      targetPort: rest
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: workspace-runtime
  namespace: datacode
  labels:
    app: workspace-runtime
spec:
  serviceName: workspace-runtime
  # Replica count maps to lease capacity (design 07 Q3): capacity =
  # replicas x lease.max_per_instance, with the per-instance memory budget
  # as the real driver. Scale with capacity monitoring, not CPU.
  replicas: 3
  selector:
    matchLabels:
      app: workspace-runtime
  template:
    metadata:
      labels:
        app: workspace-runtime
    spec:
      # Graceful drain is the zero-loss shutdown path (design 07 Q6): the pod
      # takes a final WIP snapshot of every held working copy on SIGTERM.
      # 2 minutes covers a snapshot round; a faster kill trades the last
      # (<=10 min) snapshot for downtime.
      terminationGracePeriodSeconds: 120
      containers:
        - name: workspace-runtime
          image: datacode/workspace-runtime:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: rest
              containerPort: 8002
          env:
            # The config mechanism, identical to every other deployment shape:
            # conf/ from the ConfigMap, profile selected by DATACODE_ENV. The
            # base declares the cell profile (workspace-runtime exists only in
            # cells); overlays replace it where they must.
            - name: CONFIG_PATH
              value: /app/conf
            - name: DATACODE_ENV
              value: k8s-cell
            # Stable identity from the pod name: lease keys, heartbeats and
            # the advertised dial address all hang off this. Restarting the
            # pod RE-ADOPTS its previous leases instead of orphaning them.
            - name: DATACODE_RUNTIME_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DATACODE_CELL_ID
              value: cell-0
            # Lease subsystem: ON and not optional — instance_local storage
            # without leases is a startup error by contract (replicas would
            # serve the same working copy from diverging private dirs).
            - name: WORKSPACE_RUNTIME_LEASE_ENABLED
              value: "true"
            - name: WORKSPACE_RUNTIME_MATERIALIZE_MOUNT_KIND
              value: instance_local
            - name: WORKSPACE_RUNTIME_WORKSPACE_BASE_PATH
              value: /var/lib/datacode/workspaces
            - name: WORKSPACE_RUNTIME_MATERIALIZE_ROOT
              value: /var/lib/datacode/workspaces
            # Lease routing needs the pod's dial address inside the cluster.
            - name: WORKSPACE_RUNTIME_CODE_LOCATION_ADVERTISE_HOST
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Shared secret guarding /internal/* (lease accept channel).
            - name: WORKSPACE_RUNTIME_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: datacode-internal
                  key: internal-token
            # 4b target shape: per-replica private storage + leases means the
            # env lock degrades to IN-PROCESS (the lease is the single-writer
            # guarantee, and competing writers would be on this pod only).
            # The Redis backend stays available as a config choice for the P4a
            # transitional shape (shared volume + leases).
            - name: WORKSPACE_RUNTIME_ENV_LOCK_BACKEND
              value: in_memory
            # Execution plane (design 04 §3): one Job per task. The ONLY backend
            # that can serve L2/L3-base, because those levels ARE the container.
            # Overrides conf/workspace-runtime.yaml's single-node default.
            - name: WORKSPACE_RUNTIME_TASK_BACKEND
              value: kubernetes
            # The runner must be co-scheduled with THIS replica: the working copy
            # exists on the node holding its lease and nowhere else, so the
            # backend refuses to start without this (it would create Jobs that
            # can never mount their copy).
            - name: WORKSPACE_RUNTIME_TASK_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Source of the working copy the Job mounts (mount_kind:
            # instance_local -> this replica's ReadWriteOnce claim). RWO permits
            # several pods on ONE node, which is what makes the co-scheduling
            # above sufficient rather than merely convenient.
            #
            # The claim name is `<volumeClaimTemplate>-<pod>`; the StatefulSet
            # pod ordinal is not available through the downward API, so the
            # volume-aware value is derived by the pod's own name at startup.
            - name: WORKSPACE_RUNTIME_TASK_WORKCOPY_PVC
              value: workcopies-$(DATACODE_RUNTIME_ID)
            # Database password: the ONLY db-related env this process reads.
            # Host/port/name/type come from the mounted platform config.
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: datacode-db
                  key: password
            # Redis password (optional — only when the Redis requires one).
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: datacode-redis
                  key: password
                  optional: true
          volumeMounts:
            # The per-replica RWO claim: working copies + .repo caches live
            # here and survive pod restarts in place (no re-clone, no WIP
            # recovery prompt on rolling updates).
            - name: workcopies
              mountPath: /var/lib/datacode/workspaces
            # The platform configuration (base + profile), read-only.
            - name: conf
              mountPath: /app/conf
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: rest
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /health
              port: rest
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: "500m"
              memory: 2Gi
            limits:
              # The lease admission controller reads the cgroup memory limit
              # (design 07 Q3): sizing the pod changes its lease capacity
              # without any code or config change.
              memory: 8Gi
      volumes:
        # The configuration ConfigMap is generated by kustomization.yaml's
        # configMapGenerator from the repository's conf/ directory; its name
        # carries a content hash, so editing any profile triggers a rolling
        # update of this StatefulSet automatically.
        - name: conf
          configMap:
            name: datacode-conf
  volumeClaimTemplates:
    - metadata:
        name: workcopies
      spec:
        # ReadWriteOnce, per replica — the two non-negotiable properties of
        # design 07 ADR-003 Q7. RWO allows same-node multi-pod attach, which
        # is what the P6 task-runner will use to mount a working copy.
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Gi
