# Secret STRUCTURE — never real values.
#
# Create the real Secrets with kubectl (the commands below), which keeps them
# out of git entirely. Every key maps to an env var documented in
# conf/platform.yaml's `security` section.
#
# THREE namespaces need Secrets, and the split is not cosmetic: a Secret
# cannot be referenced across namespaces, so a value used by two tiers has to
# be CREATED TWICE with the same content. Where that applies it is called out
# below — the failure mode of getting it wrong (two halves of one shared
# secret disagreeing) is a 401 that names neither side.
#
# ── datacode (the cell tier) ─────────────────────────────────────────────
#
#   kubectl -n datacode create secret generic datacode-db \
#     --from-literal=password="$(openssl rand -hex 16)"
#
#   kubectl -n datacode create secret generic datacode-secrets \
#     --from-literal=gateway-jwt-secret="$(openssl rand -hex 32)" \
#     --from-literal=identity-internal-token="$(openssl rand -hex 16)" \
#     --from-literal=runtime-internal-token="$(openssl rand -hex 16)" \
#     --from-literal=agent-llm-api-key="sk-..."
#
# `runtime-internal-token` is read by BOTH sides of the runtime's /internal/*
# channel — gateway/control/agent send it, workspace-runtime verifies it —
# from this one Secret, so they cannot drift.
#
# Optional (only when your Redis requires a password):
#   kubectl -n datacode create secret generic datacode-redis \
#     --from-literal=password="..."
#
# ── datacode-global (the global tier) ────────────────────────────────────
#
# The db password and the JWT secret MUST be the same VALUES as the cell's
# (one installation signs tokens once), but they are separate OBJECTS:
#
#   kubectl -n datacode-global create secret generic datacode-db \
#     --from-literal=password="<same value as the cell one>"
#   kubectl -n datacode-global create secret generic datacode-secrets \
#     --from-literal=gateway-jwt-secret="<same value>" \
#     --from-literal=identity-internal-token="<same value>"
#
# ── datacode-tasks (the sandbox egress plane) ────────────────────────────
#
# Only needed when the egress plane runs. The signing secret has a MINTER
# (workspace-runtime, in `datacode`) and a VERIFIER (egress-proxy, in
# `datacode-tasks`), so the same value is created in both namespaces:
#
#   TASK_TOKEN="$(openssl rand -hex 32)"
#   kubectl -n datacode       create secret generic datacode-task-token \
#     --from-literal=signing-secret="$TASK_TOKEN"
#   kubectl -n datacode-tasks create secret generic datacode-task-token \
#     --from-literal=signing-secret="$TASK_TOKEN"
#
# The runtime's reference is `optional: true`: a cluster without the egress
# plane mints nothing and must not be forced to carry a secret with no
# consumer. The proxy's reference is required — a proxy that cannot verify
# would have to either deny everything or trust everything.
#
# Optional there as well, when Redis requires a password (the proxy reads the
# per-task grants from it):
#   kubectl -n datacode-tasks create secret generic datacode-redis \
#     --from-literal=password="..."
#
# ── Verifying ────────────────────────────────────────────────────────────
#
# Every secretKeyRef in this base resolves to one of the names above. To check
# a cluster before rolling out:
#
#   kubectl kustomize --load-restrictor LoadRestrictionsNone \
#     deploy/k8s/overlays/cell | grep -A2 secretKeyRef | grep 'name:' | sort -u
#
# ── Why this file is not applied ─────────────────────────────────────────
#
# It documents shapes. Listing it in kustomization.yaml would render these
# placeholder values into the cluster as real Secrets, which is exactly the
# outcome "never real values" exists to prevent.
