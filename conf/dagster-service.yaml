# Dagster Service Configuration
# Role: FastAPI wrapper around a Dagster deployment (local/remote dual-mode).
server:
  rest_port: 8004                 # NOTE: 8003 is ontology-service
  host: "0.0.0.0"

dagster:
  mode: "local"                   # "local" | "remote"

  # Code Location gRPC server — ALWAYS local (loads asset-dag/ user code).
  code_location_host: "0.0.0.0"
  code_location_port: 4000

  # Local mode only: DagsterInstance (SQLite) + daemon + webserver.
  home: "~/.agenticdata/dagster_home"
  daemon_enabled: true
  webserver_enabled: true
  webserver_host: "0.0.0.0"
  webserver_port: 3001
  graphql_url: "http://localhost:3001/graphql"

  # Remote mode only: connect to a remote DagsterInstance webserver.
  # In remote mode the local Code Location gRPC endpoint must be registered to
  # the remote DagsterInstance (via workspace.yaml or GraphQL) so the remote
  # daemon/webserver can discover and drive it.
  remote_graphql_url: ""          # e.g. "http://dagster-prod:3000/graphql"
  # remote_token is read from env DAGSTER_SERVICE_DAGSTER_REMOTE_TOKEN (never hard-coded).

  # Subprocess lifecycle.
  process_start_timeout: 30
  process_stop_timeout: 5

# Workspace storage — must match sqlmesh-service base path.
workspace:
  base_path: "~/.agenticdata/workspaces"

# SQLMesh service URL (for the SQLMesh -> Dagster bridge).
sqlmesh:
  service_url: "http://localhost:8002"
  request_timeout: 10

# Logging
logging:
  level: "debug"
