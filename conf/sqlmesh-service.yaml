# SQLMesh Service Configuration
# Role: Task scheduler + Worker Pool Manager for SQLMesh operations.
#
# Service-specific settings only. Database, workspace, and logging are
# sourced from conf/platform.yaml.
server:
  grpc_port: 50052
  rest_port: 8002
  host: "0.0.0.0"

# Worker Pool configuration
# MVP: process pool mode (subprocess per task, zero external dependencies).
# Future: k8s_job mode for large-scale production.
worker_pool:
  mode: "process"                 # "process" (MVP) or "k8s_job" (production)
  max_workers: 5                  # Max concurrent Worker subprocesses
  task_timeout_seconds: 600       # Max time per task before forced kill
  idle_timeout_seconds: 300       # Idle Worker recycled after this period

# SQLMesh defaults
sqlmesh:
  default_dialect: "duckdb"
  query_row_limit: 1000

# Concurrency control
concurrency:
  workspace_write_lock_ttl: 600   # Workspace write lock timeout (seconds)
  environment_lock_ttl: 900       # Environment lock timeout (seconds)

# ── Shared config (from platform.yaml) ──────────────────────────────────
# database:      → platform.yaml → database (password: env DB_PASSWORD)
# workspace:     → platform.yaml → workspace.base_path
# logging:       → platform.yaml → logging.level
#
# To override per-service, use env vars:
#   SQLMESH_SERVICE_DB_HOST, SQLMESH_SERVICE_DB_PORT, etc.
