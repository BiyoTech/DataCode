# nginx configuration for the frontend container.
#
# Serves the built SPA and reverse-proxies the API to the gateway, so the
# browser talks to one origin and the gateway is never exposed directly.
#
# The gateway address is injected at deploy time via NGINX_ENVSUBST (see the
# compose files / K8s manifests): the template variable ${GATEWAY_UPSTREAM}
# below is replaced when the container starts. Default matches the compose
# service name.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip on for the textual payloads a SPA actually ships.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Liveness for the container healthcheck. A constant: nginx serving this
    # file IS the health signal.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # API reverse proxy. Long timeouts: SSE and slow plan/apply calls hold
    # connections open on purpose.
    location /api/ {
        proxy_pass http://${GATEWAY_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # WebSocket reverse proxy (agent chat). The upgrade dance is required by
    # the protocol, not optional.
    location /ws/ {
        proxy_pass http://${GATEWAY_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback: every non-file path serves index.html so client-side
    # routing works on deep links and refreshes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed static assets are immutable; index.html must always revalidate.
    location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
