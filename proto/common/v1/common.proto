syntax = "proto3";

package common.v1;

option go_package = "github.com/agenticdata/proto/common/v1;commonv1";

// Pagination request parameters
message PaginationRequest {
  int32 page = 1;
  int32 page_size = 2;
}

// Pagination response metadata
message PaginationResponse {
  int32 total = 1;
  int32 page = 2;
  int32 page_size = 3;
}

// Standardized error detail
message ErrorDetail {
  string code = 1;
  string message = 2;
  map<string, string> metadata = 3;
}

// UTC timestamp wrapper for cross-service consistency
message Timestamp {
  int64 seconds = 1;
  int32 nanos = 2;
}
