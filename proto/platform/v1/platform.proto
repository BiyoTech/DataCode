syntax = "proto3";

package platform.v1;

option go_package = "github.com/agenticdata/proto/platform/v1;platformv1";

import "common/v1/common.proto";

// PlatformService manages projects, users, and metadata.
// Maps to "Project" and "Identity & Tenant" bounded contexts.
service PlatformService {
  // --- Project Management ---

  // CreateProject creates a new Project with its Gateway and Git configuration.
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);

  // GetProject retrieves Project details by ID.
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse);

  // ListProjects lists all Projects accessible to the user.
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);

  // UpdateProject updates Project settings (gateway, dialect, schedule, etc.).
  rpc UpdateProject(UpdateProjectRequest) returns (UpdateProjectResponse);

  // DeleteProject removes a Project and its associated resources.
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse);

  // --- User Management (MVP: hardcoded admin) ---

  // GetCurrentUser returns the current user info (MVP: always admin).
  rpc GetCurrentUser(GetCurrentUserRequest) returns (GetCurrentUserResponse);
}

// --- Project Messages ---

message CreateProjectRequest {
  string tenant_id = 1;
  string name = 2;
  string description = 3;
  string dialect = 4;           // SQL Dialect: "postgres", "bigquery", "snowflake", "duckdb"
  GatewayConfig gateway = 5;    // Gateway connection configuration
  string cron_schedule = 6;     // optional: default cron for scheduling
}

message CreateProjectResponse {
  string project_id = 1;
  string git_repo_url = 2;  // auto-created Gitea repo URL
}

message GetProjectRequest {
  string project_id = 1;
}

message GetProjectResponse {
  ProjectInfo project = 1;
}

message ListProjectsRequest {
  string tenant_id = 1;
  common.v1.PaginationRequest pagination = 2;
}

message ListProjectsResponse {
  repeated ProjectInfo projects = 1;
  common.v1.PaginationResponse pagination = 2;
}

message UpdateProjectRequest {
  string project_id = 1;
  optional string name = 2;
  optional string description = 3;
  optional string dialect = 4;
  optional GatewayConfig gateway = 5;
  optional string cron_schedule = 6;
}

message UpdateProjectResponse {
  bool success = 1;
}

message DeleteProjectRequest {
  string project_id = 1;
}

message DeleteProjectResponse {
  bool success = 1;
}

// --- User Messages ---

message GetCurrentUserRequest {}

message GetCurrentUserResponse {
  UserInfo user = 1;
}

// --- Domain Entities ---

// ProjectInfo represents the Project entity from domain model.
message ProjectInfo {
  string project_id = 1;
  string tenant_id = 2;
  string name = 3;
  string description = 4;
  string git_repo_url = 5;
  string git_branch = 6;       // default branch (e.g. "main")
  string dialect = 7;          // SQL Dialect
  GatewayConfig gateway = 8;   // Gateway connection config
  string cron_schedule = 9;
  string status = 10;          // "active", "archived"
  common.v1.Timestamp created_at = 11;
  common.v1.Timestamp updated_at = 12;
}

// GatewayConfig represents the Gateway entity - database connection configuration.
message GatewayConfig {
  string type = 1;        // "postgres", "bigquery", "snowflake", "duckdb"
  string host = 2;
  int32 port = 3;
  string database = 4;
  string schema = 5;
  string user = 6;
  string password = 7;    // stored encrypted in production
  map<string, string> extra = 8;  // additional driver-specific options
}

// UserInfo represents the User entity from domain model (MVP: hardcoded admin).
message UserInfo {
  string user_id = 1;
  string tenant_id = 2;
  string username = 3;
  string email = 4;
  string role = 5;  // "admin", "developer", "viewer"
}
