syntax = "proto3";

package workspace.v1;

option go_package = "github.com/agenticdata/proto/workspace/v1;workspacev1";

import "common/v1/common.proto";

// WorkspaceService manages user-level isolated development environments.
// Maps to the "Workspace" bounded context in domain model.
service WorkspaceService {
  // CreateWorkspace initializes a new Workspace for a user in a project.
  rpc CreateWorkspace(CreateWorkspaceRequest) returns (CreateWorkspaceResponse);

  // GetWorkspace retrieves Workspace metadata and status.
  rpc GetWorkspace(GetWorkspaceRequest) returns (GetWorkspaceResponse);

  // ActivateWorkspace transitions a Workspace from hibernating to active.
  rpc ActivateWorkspace(ActivateWorkspaceRequest) returns (ActivateWorkspaceResponse);

  // --- File Operations (FileChange) ---

  // ReadFile reads content from a file in the Workspace.
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse);

  // WriteFile creates or overwrites a file in the Workspace.
  rpc WriteFile(WriteFileRequest) returns (WriteFileResponse);

  // DeleteFile removes a file from the Workspace.
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse);

  // ListFiles lists files in a directory within the Workspace.
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);

  // --- Git Operations (GitBranch) ---

  // GitStatus returns uncommitted FileChanges in the Workspace.
  rpc GitStatus(GitStatusRequest) returns (GitStatusResponse);

  // GitCommit commits staged FileChanges with a message.
  rpc GitCommit(GitCommitRequest) returns (GitCommitResponse);

  // GitDiff returns the diff of uncommitted FileChanges.
  rpc GitDiff(GitDiffRequest) returns (GitDiffResponse);

  // GitPull pulls latest changes from remote GitBranch.
  rpc GitPull(GitPullRequest) returns (GitPullResponse);

  // GitPush pushes local commits to remote GitBranch.
  rpc GitPush(GitPushRequest) returns (GitPushResponse);
}

// --- Workspace Lifecycle ---

message CreateWorkspaceRequest {
  string tenant_id = 1;
  string user_id = 2;
  string project_id = 3;
  string git_repo_url = 4;   // Gitea repository URL
  string git_branch = 5;     // branch to checkout (default: "main")
}

message CreateWorkspaceResponse {
  string workspace_id = 1;
  string local_path = 2;
}

message GetWorkspaceRequest {
  string workspace_id = 1;
}

message GetWorkspaceResponse {
  WorkspaceInfo workspace = 1;
}

message ActivateWorkspaceRequest {
  string workspace_id = 1;
}

message ActivateWorkspaceResponse {
  bool success = 1;
  string local_path = 2;
}

// WorkspaceInfo represents the Workspace entity from domain model.
message WorkspaceInfo {
  string workspace_id = 1;
  string tenant_id = 2;
  string user_id = 3;
  string project_id = 4;
  string local_path = 5;
  string git_branch = 6;
  string status = 7;          // "uninitialized", "initializing", "active", "hibernating", "destroying"
  common.v1.Timestamp last_active_at = 8;
  common.v1.Timestamp created_at = 9;
}

// --- File Operations ---

message ReadFileRequest {
  string workspace_id = 1;
  string file_path = 2;  // relative path within workspace
}

message ReadFileResponse {
  string content = 1;
  bool exists = 2;
}

message WriteFileRequest {
  string workspace_id = 1;
  string file_path = 2;    // relative path within workspace
  string content = 3;
  bool create_dirs = 4;    // auto-create parent directories
}

message WriteFileResponse {
  bool success = 1;
  string absolute_path = 2;
}

message DeleteFileRequest {
  string workspace_id = 1;
  string file_path = 2;
}

message DeleteFileResponse {
  bool success = 1;
}

message ListFilesRequest {
  string workspace_id = 1;
  string directory = 2;     // relative directory path, empty = root
  bool recursive = 3;
  string pattern = 4;       // optional glob pattern (e.g. "*.sql")
}

message ListFilesResponse {
  repeated FileInfo files = 1;
}

message FileInfo {
  string path = 1;          // relative path
  bool is_directory = 2;
  int64 size_bytes = 3;
  common.v1.Timestamp modified_at = 4;
}

// --- Git Operations ---

message GitStatusRequest {
  string workspace_id = 1;
}

message GitStatusResponse {
  string branch = 1;
  repeated FileChange changes = 2;
  bool has_uncommitted = 3;
}

// FileChange represents a file modification tracked by Git.
message FileChange {
  string path = 1;
  string status = 2;  // "added", "modified", "deleted", "renamed"
}

message GitCommitRequest {
  string workspace_id = 1;
  string message = 2;
  repeated string paths = 3;  // specific files to stage, empty = all
}

message GitCommitResponse {
  string commit_hash = 1;
}

message GitDiffRequest {
  string workspace_id = 1;
  string file_path = 2;  // optional: specific file, empty = all changes
}

message GitDiffResponse {
  string diff = 1;
}

message GitPullRequest {
  string workspace_id = 1;
}

message GitPullResponse {
  bool success = 1;
  bool has_conflicts = 2;
  repeated string conflict_files = 3;
}

message GitPushRequest {
  string workspace_id = 1;
}

message GitPushResponse {
  bool success = 1;
}
