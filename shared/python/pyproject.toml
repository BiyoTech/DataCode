[project]
name = "agenticdata-common"
version = "0.1.0"
description = "Shared infrastructure utilities for AgenticData Python services"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "structlog>=24.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agenticdata_common"]
