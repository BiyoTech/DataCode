
# ontology/semantic_model.yaml
# 一个文件 = 一个业务域 = 完整语义模型
# 类似 dbt 语义层，但增加了 OSI 的 ontology 能力

version: "0.1.0"
description: >
  Sushi restaurant retail analytics semantic model.
  Defines business concepts, their relationships, dimensions,
  and maps them to SQLMesh physical models.
ai_context:
  instructions: "Use this model for sushi restaurant sales and customer analytics"
  synonyms: [sushi analytics, restaurant data]

# ================================================================
# 实体 = 概念声明 + 物理模型映射，一体定义
# 类似 dbt semantic_model.entities，但以业务概念为中心
# ================================================================
entities:

  # ----------------------------------------------------------
  - name: Customer
    description: A person or organization that places orders
    type: EntityType

    # ── 物理映射（类似 dbt 的 model: ref('customers')）──
    model: sushi.customers           # SQLMesh 模型全限定名

    # ── 标识键（对应 SQLMesh grain，支持多个列）──
    key:
      customer_id: customer_id       # 概念属性名: 模型物理列名

    # ── 属性（类似 dbt dimensions）──
    attributes:
      - name: status
        column: status               # 模型中的物理列名
        type: categorical
        ai_context:
          synonyms: [customer state, account status]

    # ── 子概念 / 继承（OSI 特性）──
    sub_concepts:
      - name: ActiveCustomer
        derived_by: "EXISTS(Customer.places.Order)"
        description: A customer who has placed at least one order

    ai_context:
      synonyms: [client, account, patron]

  # ----------------------------------------------------------
  - name: Order
    description: A purchase transaction placed by a Customer
    type: EntityType

    model: sushi.orders

    key:
      order_id: id                  # 概念层叫 order_id，物理列叫 id（grain: id AS order_id）

    # 外键属性（类似 dbt entity type: foreign）
    foreign_keys:
      - name: customer_id
        column: customer_id
        references: Customer.customer_id
      - name: waiter_id
        column: waiter_id
        references: Waiter.waiter_id

    attributes:
      - name: event_date
        column: event_date
        type: time
        granularity: day
        ai_context:
          synonyms: [order date, purchase date]

    ai_context:
      synonyms: [purchase, transaction, sale]

  # ----------------------------------------------------------
  - name: OrderItem
    description: A line item within an Order
    type: EntityType

    model: sushi.order_items

    key:
      item_id: id

    foreign_keys:
      - name: order_id
        column: order_id
        references: Order.order_id

    attributes:
      - name: quantity
        column: quantity
        ai_context:
          synonyms: [item count, units]

  # ----------------------------------------------------------
  - name: Waiter
    description: Staff member who serves orders
    type: EntityType

    model: sushi.waiter_names

    key:
      waiter_id: id

# ================================================================
# 关系 = 语义关系 + 物理 JOIN 条件，一体定义
# 类似 dbt 的 entity type: foreign 但增加了
# OSI 的 verbalizes（自然语言表述）和 multiplicity
# ================================================================
relationships:
  - name: Customer.places                    # 完整关系名
    from: Customer
    to: Order
    join:
      - [customer_id, customer_id]           # [from实体属性, to实体属性]
    multiplicity: ManyToOne
    verbalizes:
      - "{Customer} places {Order}"
      - "{Order} is placed by {Customer}"

  - name: Customer.has_status
    from: Customer
    to: Customer                             # 自引用：同实体的不同属性
    join:
      - [customer_id, customer_id]
    via_attribute: status                    # 关系的"值"来自此属性
    multiplicity: ManyToOne
    verbalizes:
      - "{Customer} has status {status}"

  - name: Order.contains
    from: Order
    to: OrderItem
    join:
      - [order_id, order_id]
    multiplicity: ManyToOne
    verbalizes:
      - "{Order} contains {OrderItem}"
      - "{OrderItem} belongs to {Order}"

  - name: Order.served_by
    from: Order
    to: Waiter
    join:
      - [waiter_id, waiter_id]
    multiplicity: ManyToOne
    verbalizes:
      - "{Order} is served by {Waiter}"

  - name: Order.ordered_on
    from: Order
    to: Order
    join:
      - [order_id, order_id]
    via_attribute: event_date
    multiplicity: ManyToOne
    verbalizes:
      - "{Order} was ordered on {event_date}"

  - name: OrderItem.has_quantity
    from: OrderItem
    to: OrderItem
    join:
      - [item_id, item_id]
    via_attribute: quantity
    multiplicity: ManyToOne
    verbalizes:
      - "{OrderItem} has quantity {quantity}"

# ================================================================
# 指标 = 语义层指标定义 + SQLMesh METRIC 标注
# 可以全新定义，也可以引用已有 SQLMesh METRIC
# 类似 dbt metrics，但内联在同一个文件中
# ================================================================
metrics:
  # ── 基础指标 ──
  - name: total_orders
    description: Total number of orders
    aggregate: COUNT
    expression: Order.order_id
    entity: Order
    ai_context:
      synonyms: [order count, number of orders, total purchases]

  - name: total_ordered_items
    description: Total quantity of items ordered
    aggregate: SUM
    expression: OrderItem.quantity
    entity: OrderItem
    ai_context:
      synonyms: [items sold, quantity ordered]

  - name: total_orders_from_active_customers
    description: Orders placed by customers with ACTIVE status
    aggregate: COUNT
    expression: Order.order_id
    filter: "Customer.status = 'ACTIVE'"         # 语义层过滤
    entities: [Order, Customer]
    ai_context:
      synonyms: [active orders, active customer orders]

  # ── 派生指标（引用其他指标）──
  - name: items_per_order
    description: Average number of items per order
    derived:
      formula: total_ordered_items / total_orders
    entities: [OrderItem, Order]
    ai_context:
      synonyms: [average items, items per purchase]

  # ── 引用已有 SQLMesh METRIC（不改动原有 DDL）──
  - name: sushi_total_orders
    maps_to: total_orders                        # 对应 METRIC(name total_orders)
    # 继承原 METRIC 定义，此处仅增加语义标注
    ai_context:
      examples:
        - "How many orders were placed last week?"
