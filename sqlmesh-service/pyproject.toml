[project]
name = "sqlmesh-service"
version = "0.2.0"
description = "SQLMesh Service - Context Pool based SQLMesh operations"
requires-python = ">=3.11"
dependencies = [
    "sqlmesh>=0.142.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "structlog>=24.4.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "aiomysql>=0.2.0",
    "httpx>=0.27.0",
    "sqlglot>=25.0.0",
    "agenticdata-common @ file:../shared/python",
]

[tool.hatch.metadata]
allow-direct-references = true

[project.optional-dependencies]
db = ["aiosqlite>=0.20.0", "asyncpg>=0.30.0", "aiomysql>=0.2.0"]
grpc = [
    "grpcio>=1.68.0",
    "grpcio-tools>=1.68.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "alembic>=1.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
