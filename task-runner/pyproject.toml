[project]
name = "datacode-task-runner"
version = "0.1.0"
description = "Sandboxed execution vehicle for DataCode tasks (design 04 §3)"
requires-python = ">=3.11"

# Deliberately short. This process runs untrusted input, so every dependency is
# attack surface and every one that could reach the platform is a design error:
#   * no fastapi / uvicorn  -- the runner serves no traffic;
#   * no redis / aiomysql   -- it coordinates with nothing and stores nothing;
#   * no httpx by default   -- progress callbacks (P6b) are best-effort and are
#                              added with the network policy that permits them.
#
# datacode-common is here for ONE module, `task_protocol` (pure stdlib): the
# spec/result contract must not be a second copy that can drift from the
# runtime's. It transitively brings sqlalchemy, which is unused here — the
# safety property is that this container holds NO credentials, not that it
# lacks a database driver.
dependencies = [
    "sqlmesh>=0.145.0",
    # SQLMesh's engine driver for a postgres project. This container never
    # connects to a warehouse itself, but `Context(paths=...)` validates the
    # project's config.yaml first, and that validation IMPORTS the engine
    # library named in it — so a postgres project cannot be loaded at all
    # without the driver, failing every plan/apply as "Failed to import the
    # 'postgres' engine library".
    #
    # Deliberately the only driver here: it is the platform's own engine. A
    # project targeting another warehouse stays unloadable in this sandbox,
    # which is an honest and visible limitation rather than one dependency
    # tree per engine.
    "psycopg2-binary>=2.9.0",
    "datacode-common",
]

[project.optional-dependencies]
# ── Platform-provided packages user code imports in the sandbox ───────────
#
# This image is where user code actually RUNS in a cluster deployment: the
# Kubernetes task backend (`task.backend: kubernetes`) submits every task here,
# and `dagster.code_location_mode: pod` loads a working copy's `defs/` package
# in it. A package with no wheel can therefore only reach user code by being
# baked into THIS image — the same reason workspace-runtime has the equivalent
# extra, and the same example.
#
# `spark` is the only one today: pyspark publishes a single ~300 MB source
# distribution per release, and installs are wheel-only (no compiler in the
# sandbox, no build script ever executed), so a working copy can never declare
# its way to it. Opt-in because it costs well over half a gigabyte plus a JRE:
# `docker build --build-arg RUNNER_EXTRAS=spark` (see the Dockerfile, which also
# installs the JRE).
#
# One thing to know when using it: the platform baseline that decides what is
# ALREADY provided is computed by workspace-runtime, from its own interpreter
# (see src/deps/baseline.py). So a working copy declaring pyspark is only
# recognised as platform-provided when BOTH images carry it — bake it into the
# runtime image too (`RUNTIME_EXTRAS=spark`), or the install still fails with
# `deps_no_wheel` while the import would have worked.
spark = ["pyspark>=3.5.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
datacode-task-runner = "src.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "DTZ"]

[tool.pytest.ini_options]
testpaths = ["tests"]
